<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <title>LFC Technology Risk Maturity Assessment</title>

  
  <script src="https://cdn.tailwindcss.com"></script>

  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script></head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // Simple inline SVG icons (replacing Lucide)
    const DownloadIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
    );

    const ChevronDownIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="6 9 12 15 18 9" />
      </svg>
    );

    const ChevronRightIcon = ({ size = 24 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    );

    const MaturityAssessment = () => {
      const [expandedSections, setExpandedSections] = useState({});
      const [responses, setResponses] = useState({});

      const maturityLevels = [
        { value: 0, label: 'Not Started', color: 'bg-gray-200', textColor: 'text-gray-700' },
        { value: 1, label: 'Initial', color: 'bg-red-200', textColor: 'text-red-700' },
        { value: 2, label: 'Developing', color: 'bg-orange-200', textColor: 'text-orange-700' },
        { value: 3, label: 'Defined', color: 'bg-yellow-200', textColor: 'text-yellow-700' },
        { value: 4, label: 'Managed', color: 'bg-blue-200', textColor: 'text-blue-700' },
        { value: 5, label: 'Optimized', color: 'bg-green-200', textColor: 'text-green-700' }
      ];

      const assessmentControls = [
        {
          section: '4. Technology Risk Governance and Oversight',
          ref: '4.1-4.5',
          controls: [
            { id: '4.1', control: 'Role of Board of Directors', description: 'Board formulates IT and cyber security strategy aligned with risks and business strategy', complianceDate: '01.01.2023' },
            { id: '4.1a', control: 'Board Approved Policies', description: 'Information security policy, risk management framework, and Board oversight in place', complianceDate: '01.01.2023' },
            { id: '4.1b', control: 'Third Party Risk Evaluation', description: 'Engagement with third parties evaluated for IT and cyber risks including cloud and Fintech', complianceDate: '01.01.2023' },
            { id: '4.1c', control: 'Board Information Security Committee', description: 'Board level ISC established and operational', complianceDate: '01.01.2023' },
            { id: '4.2', control: 'Technology Risk Management Framework', description: 'Framework covering identification, protection, detection, response and recovery', complianceDate: '01.01.2023' },
            { id: '4.3b', control: 'Management Level ISC', description: 'Management level ISC headed by CEO established and operational', complianceDate: '01.07.2023' },
            { id: '4.3c', control: 'Cyber Hygiene', description: 'Cyber hygiene maintained and awareness programs conducted regularly', complianceDate: '01.01.2023' },
            { id: '4.4', control: 'Chief Information Security Officer (CISO)', description: 'CISO appointed with defined responsibilities and appropriate reporting line', complianceDate: '01.01.2025' },
            { id: '4.5', control: 'Internal Audit', description: 'Compliance with directions audited internally at least annually', complianceDate: '01.01.2023' }
          ]
        },
        {
          section: '5. Information and Information System Security',
          ref: '5.1-5.11',
          controls: [
            { id: '5.1', control: 'Fair and Ethical Use of Customer Data', description: 'Policies for fair and ethical use of customer data in place and enforced', complianceDate: '01.01.2023' },
            { id: '5.2', control: 'Information Classification and Labelling', description: 'Board approved classification policy with all electronic data classified and labelled', complianceDate: '01.07.2023' },
            { id: '5.3', control: 'Critical Information Systems Identification', description: 'Critical information systems identified by Board on BIRMC/ISC recommendations', complianceDate: '01.07.2023' },
            { id: '5.4', control: 'User Access Management', description: 'Industry standard user access and identity management system implemented', complianceDate: '01.01.2024' },
            { id: '5.4e', control: 'Privileged User Access', description: 'Privileged access on need-to-have basis with logging and monitoring', complianceDate: '01.01.2024' },
            { id: '5.4f', control: 'User Access Reviews', description: 'Access reviews: monthly (critical), quarterly (non-critical), annual (others)', complianceDate: '01.01.2024' },
            { id: '5.5', control: 'Computer Security and User Activity Log Management', description: 'Log management policy implemented for critical systems and customer data systems', complianceDate: '01.01.2024' },
            { id: '5.6.1', control: 'Customer Data Encryption', description: 'Data-at-rest, data-in-transit, and full disk encryption implemented', complianceDate: '01.01.2024' },
            { id: '5.6.2', control: 'Confidential Non-Customer Data Encryption', description: 'Encryption requirements applied to confidential non-customer data', complianceDate: '01.01.2024' },
            { id: '5.7', control: 'Security Operations Center (SOC)', description: 'SOC implemented for LFCs offering electronic delivery channels', complianceDate: '01.01.2026' },
            { id: '5.8', control: 'Data Loss Prevention (DLP)', description: 'Industry standard DLP tools implemented across LFC and third parties', complianceDate: '01.01.2024' },
            { id: '5.9.1', control: 'Incident Response Plan (IRP)', description: 'Up-to-date IRP approved by Board with escalation and recovery procedures', complianceDate: '01.01.2024' },
            { id: '5.9.2', control: 'Incident Response Testing', description: 'Response and recovery capabilities tested annually with realistic scenarios', complianceDate: '01.01.2024' },
            { id: '5.10.1', control: 'Pre-Implementation Security Testing', description: 'SAST, DAST, QA testing, and vulnerability assessments conducted', complianceDate: '01.01.2024' },
            { id: '5.10.2', control: 'Vulnerability Assessments', description: 'VA conducted bi-annually on critical systems and customer data systems', complianceDate: '01.01.2024' },
            { id: '5.10.3', control: 'Penetration Testing', description: 'Annual PT by independent external experts on critical systems', complianceDate: '01.01.2024' },
            { id: '5.11.1', control: 'Board Training and Awareness', description: 'Annual training program for Board on information security and technology risk', complianceDate: '01.07.2023' },
            { id: '5.11.2', control: 'Staff Security Awareness Training', description: 'Staff, agents, and third parties trained and certified on information security', complianceDate: '01.07.2023' }
          ]
        },
        {
          section: '6. Information System Availability and Disaster Recovery',
          ref: '6.1-6.5',
          controls: [
            { id: '6.2', control: 'System Availability', description: 'High availability targets established and monitored for critical systems', complianceDate: '01.07.2023' },
            { id: '6.3', control: 'Disaster Recovery Arrangements', description: 'DR arrangements with RTO < 6 hours and RPO of zero or near zero', complianceDate: '01.07.2023' },
            { id: '6.4', control: 'DR Activation', description: 'DR activation triggers established for each critical system', complianceDate: '01.07.2023' },
            { id: '6.5', control: 'DR Testing', description: 'DR arrangements tested annually by operating all critical systems for one day', complianceDate: '01.07.2023' }
          ]
        },
        {
          section: '7. Staff Competency Requirements',
          ref: '7.1',
          controls: [
            { id: '7.1', control: 'Staff Qualifications', description: 'Staff with requisite qualifications employed in security, risk, and audit functions', complianceDate: '01.01.2023' }
          ]
        },
        {
          section: '8. Third Party Service Provider Management',
          ref: '8.1-8.9',
          controls: [
            { id: '8.1', control: 'Third Party Oversight', description: 'Effective oversight and risk management for third party engagements', complianceDate: '01.01.2023' },
            { id: '8.3', control: 'Third Party Assessment', description: 'Due diligence and risk assessment conducted before engaging third parties', complianceDate: '01.01.2023' },
            { id: '8.4', control: 'Service Level Agreements', description: 'Comprehensive SLAs with all required provisions established', complianceDate: '01.01.2023' },
            { id: '8.6', control: 'Third Party Regulatory Compliance', description: 'Third parties comply with all relevant regulatory requirements', complianceDate: '01.01.2023' },
            { id: '8.7', control: 'Data Recovery and Incident Notification', description: 'Data recoverable and clear incident notification arrangements in place', complianceDate: '01.01.2023' },
            { id: '8.8', control: 'Data Segregation', description: 'LFC data logically segregated from other clients with access controls', complianceDate: '01.01.2023' },
            { id: '8.9', control: 'Critical System Recovery', description: 'Strong recovery capability and orderly exit provisions for critical systems', complianceDate: '01.01.2023' }
          ]
        },
        {
          section: '9. Cloud Services',
          ref: '9.1-9.6',
          controls: [
            { id: '9.1', control: 'Cloud Risk Understanding', description: 'Inherent risks of cloud services fully understood', complianceDate: '01.01.2023' },
            { id: '9.2', control: 'Comprehensive Cloud Risk Assessment', description: 'Risk assessment covering deployment model, migration, location, security, etc.', complianceDate: '01.01.2023' },
            { id: '9.3', control: 'Cloud Configuration Assessment', description: 'Selected configuration assessed for redundancy, availability, scalability, etc.', complianceDate: '01.01.2023' },
            { id: '9.4', control: 'Cloud Provider Certifications', description: 'Independent internationally recognized certifications verified', complianceDate: '01.01.2023' },
            { id: '9.5', control: 'Critical Systems Identification for Cloud', description: 'Critical and non-critical systems identified with documented risk assessment', complianceDate: '01.01.2023' },
            { id: '9.6', control: 'Cloud Data Protection', description: 'Safeguards implemented with ownership, control, and key management retained', complianceDate: '01.01.2023' }
          ]
        }
      ];

      const toggleSection = (sectionIndex) => {
        setExpandedSections(prev => ({
          ...prev,
          [sectionIndex]: !prev[sectionIndex]
        }));
      };

      const handleResponse = (controlId, value, field) => {
        setResponses(prev => ({
          ...prev,
          [controlId]: {
            ...prev[controlId],
            [field]: value
          }
        }));
      };

      const calculateScores = useMemo(() => {
        const sectionScores = {};
        let totalScore = 0;
        let totalControls = 0;

        assessmentControls.forEach(section => {
          let sectionTotal = 0;
          let sectionCount = 0;
          section.controls.forEach(control => {
            const response = responses[control.id];
            if (response?.maturity !== undefined) {
              sectionTotal += parseInt(response.maturity);
              sectionCount++;
            }
          });
          sectionScores[section.section] = {
            score: sectionCount > 0 ? (sectionTotal / sectionCount).toFixed(2) : 0,
            count: sectionCount,
            total: section.controls.length
          };
          totalScore += sectionTotal;
          totalControls += sectionCount;
        });

        const overallTotalControls = assessmentControls.reduce((sum, s) => sum + s.controls.length, 0);

        return {
          sectionScores,
          overallScore: totalControls > 0 ? (totalScore / totalControls).toFixed(2) : 0,
          completeness: totalControls > 0 ? ((totalControls / overallTotalControls) * 100).toFixed(1) : 0
        };
      }, [responses]);

      const exportToExcel = () => {
        let csvContent = "Section,Control ID,Control Name,Description,Compliance Date,Maturity Level,Status,Evidence,Comments,Gap Analysis\n";

        assessmentControls.forEach(section => {
          section.controls.forEach(control => {
            const response = responses[control.id] || {};
            const maturityLabel = maturityLevels.find(m => m.value === parseInt(response.maturity))?.label || 'Not Assessed';
            csvContent += `"${section.section}","${control.id}","${control.control}","${control.description}","${control.complianceDate}","${maturityLabel}","${response.status || ''}","${response.evidence || ''}","${response.comments || ''}","${response.gap || ''}"\n`;
          });
        });

        csvContent += "\n\nSUMMARY\n";
        csvContent += `Overall Maturity Score,${calculateScores.overallScore}\n`;
        csvContent += `Assessment Completeness,${calculateScores.completeness}%\n`;
        csvContent += "\nSection,Average Score,Assessed/Total\n";
        Object.entries(calculateScores.sectionScores).forEach(([section, data]) => {
          csvContent += `"${section}",${data.score},${data.count}/${data.total}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `LFC_Technology_Risk_Maturity_Assessment_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
      };

      const getMaturityColor = (score) => {
        const s = parseFloat(score);
        if (s >= 4.5) return 'text-green-600';
        if (s >= 3.5) return 'text-blue-600';
        if (s >= 2.5) return 'text-yellow-600';
        if (s >= 1.5) return 'text-orange-600';
        return 'text-red-600';
      };

      return (
        <div className="min-h-screen bg-gray-50 p-6">
          <div className="max-w-7xl mx-auto">
            {/* Header */}
            <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
              <div className="flex justify-between items-start mb-4">
                <div>
                  <h1 className="text-3xl font-bold text-gray-900 mb-2">
                    LFC Technology Risk Maturity Assessment
                  </h1>
                  <p className="text-gray-600">
                    Finance Business Act Directions No. 01 of 2022
                  </p>
                  <p className="text-sm text-gray-500 mt-2">
                    Central Bank of Sri Lanka - Technology Risk Management and Resilience
                  </p>
                </div>
                <button
                  onClick={exportToExcel}
                  className="flex items-center gap-2 bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition-colors"
                >
                  <DownloadIcon size={20} />
                  Export to Excel
                </button>
              </div>

              {/* Score Dashboard */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
                <div className="bg-blue-50 rounded-lg p-4">
                  <div className="text-sm text-blue-600 font-semibold mb-1">Overall Maturity Score</div>
                  <div className={`text-3xl font-bold ${getMaturityColor(calculateScores.overallScore)}`}>
                    {calculateScores.overallScore} / 5.0
                  </div>
                </div>
                <div className="bg-purple-50 rounded-lg p-4">
                  <div className="text-sm text-purple-600 font-semibold mb-1">Assessment Completeness</div>
                  <div className="text-3xl font-bold text-purple-600">
                    {calculateScores.completeness}%
                  </div>
                </div>
                <div className="bg-amber-50 rounded-lg p-4">
                  <div className="text-sm text-amber-600 font-semibold mb-1">Total Controls</div>
                  <div className="text-3xl font-bold text-amber-600">
                    {assessmentControls.reduce((sum, s) => sum + s.controls.length, 0)}
                  </div>
                </div>
              </div>

              {/* Maturity Scale Legend */}
              <div className="mt-6 border-t pt-4">
                <h3 className="text-sm font-semibold text-gray-700 mb-3">Maturity Scale</h3>
                <div className="flex flex-wrap gap-3">
                  {maturityLevels.map(level => (
                    <div key={level.value} className="flex items-center gap-2">
                      <div className={`w-8 h-8 rounded flex items-center justify-center ${level.color} ${level.textColor} font-bold`}>
                        {level.value}
                      </div>
                      <span className="text-sm text-gray-600">{level.label}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Assessment Sections */}
            {assessmentControls.map((section, sectionIndex) => (
              <div key={sectionIndex} className="bg-white rounded-lg shadow-lg mb-4 overflow-hidden">
                <div
                  className="bg-gray-100 p-4 cursor-pointer hover:bg-gray-200 transition-colors flex justify-between items-center"
                  onClick={() => toggleSection(sectionIndex)}
                >
                  <div className="flex items-center gap-3">
                    {expandedSections[sectionIndex] ? <ChevronDownIcon size={20} /> : <ChevronRightIcon size={20} />}
                    <div>
                      <h2 className="text-lg font-bold text-gray-900">{section.section}</h2>
                      <p className="text-sm text-gray-600">Reference: {section.ref} | {section.controls.length} controls</p>
                    </div>
                  </div>
                  <div className="text-right">
                    <div className={`text-xl font-bold ${getMaturityColor(calculateScores.sectionScores[section.section]?.score || 0)}`}>
                      {calculateScores.sectionScores[section.section]?.score || '0.00'}
                    </div>
                    <div className="text-xs text-gray-500">
                      {calculateScores.sectionScores[section.section]?.count || 0}/{section.controls.length} assessed
                    </div>
                  </div>
                </div>

                {expandedSections[sectionIndex] && (
                  <div className="p-6 space-y-6">
                    {section.controls.map((control, controlIndex) => (
                      <div key={controlIndex} className="border rounded-lg p-4 hover:shadow-md transition-shadow">
                        <div className="flex justify-between items-start mb-3">
                          <div className="flex-1">
                            <div className="flex items-center gap-2 mb-2">
                              <span className="bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-1 rounded">
                                {control.id}
                              </span>
                              <h3 className="font-bold text-gray-900">{control.control}</h3>
                            </div>
                            <p className="text-sm text-gray-600 mb-2">{control.description}</p>
                            <p className="text-xs text-gray-500">
                              Compliance Date: <span className="font-semibold">{control.complianceDate}</span>
                            </p>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                          <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                              Maturity Level *
                            </label>
                            <select
                              value={responses[control.id]?.maturity || ''}
                              onChange={(e) => handleResponse(control.id, e.target.value, 'maturity')}
                              className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            >
                              <option value="">Select maturity level</option>
                              {maturityLevels.map(level => (
                                <option key={level.value} value={level.value}>
                                  {level.value} - {level.label}
                                </option>
                              ))}
                            </select>
                          </div>

                          <div>
                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                              Implementation Status
                            </label>
                            <select
                              value={responses[control.id]?.status || ''}
                              onChange={(e) => handleResponse(control.id, e.target.value, 'status')}
                              className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            >
                              <option value="">Select status</option>
                              <option value="Fully Compliant">Fully Compliant</option>
                              <option value="Largely Compliant">Largely Compliant</option>
                              <option value="Partially Compliant">Partially Compliant</option>
                              <option value="Non-Compliant">Non-Compliant</option>
                              <option value="Not Applicable">Not Applicable</option>
                            </select>
                          </div>

                          <div className="md:col-span-2">
                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                              Evidence/Documentation
                            </label>
                            <input
                              type="text"
                              value={responses[control.id]?.evidence || ''}
                              onChange={(e) => handleResponse(control.id, e.target.value, 'evidence')}
                              placeholder="Reference documents, policies, procedures, etc."
                              className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            />
                          </div>

                          <div className="md:col-span-2">
                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                              Comments
                            </label>
                            <textarea
                              value={responses[control.id]?.comments || ''}
                              onChange={(e) => handleResponse(control.id, e.target.value, 'comments')}
                              placeholder="Additional notes, observations, or context"
                              rows="2"
                              className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            />
                          </div>

                          <div className="md:col-span-2">
                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                              Gap Analysis & Remediation Plan
                            </label>
                            <textarea
                              value={responses[control.id]?.gap || ''}
                              onChange={(e) => handleResponse(control.id, e.target.value, 'gap')}
                              placeholder="Identified gaps and planned actions for improvement"
                              rows="2"
                              className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            />
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}

            {/* Footer */}
            <div className="bg-white rounded-lg shadow-lg p-6 mt-6">
              <div className="text-center text-sm text-gray-600">
                <p className="mb-2">
                  This assessment tool is based on the Finance Business Act Directions No. 01 of 2022
                </p>
                <p>
                  Issued by the Monetary Board, Central Bank of Sri Lanka - Effective from 01.01.2023
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MaturityAssessment />);
  </script>
</body>
</html>
